<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="title desc">
  <title id="title">Products — thirteen libraries, two tools</title>
  <desc id="desc">Section banner: a dashed boundary line with a gold approval gate and a caption noting that every library ships alone.</desc>

  <rect width="1200" height="120" rx="24" fill="#0C0E12"/>
  <rect x="0.75" y="0.75" width="1198.5" height="118.5" rx="23" fill="none" stroke="#1F232C" stroke-width="1.5"/>

  <text x="56" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="17" letter-spacing="3" fill="#C9A15A">PRODUCTS — 13 LIBRARIES · 2 TOOLS</text>
  <text x="56" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="40" font-weight="600" fill="#F2EFE6">Adopt one module, or the umbrella.</text>

  <g id="gate-motif">
    <line x1="780" y1="60" x2="1144" y2="60" stroke="#3A3F4A" stroke-width="1.5" stroke-dasharray="7 6"/>
    <rect x="950" y="48" width="24" height="24" rx="6" fill="#0C0E12" stroke="#E0A93E" stroke-width="1.5"/>
    <path d="M956 60 l5 5 l9 -10" fill="none" stroke="#E0A93E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1144" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#7E8590">EVERY LIBRARY SHIPS ALONE</text>
  </g>
</svg>
