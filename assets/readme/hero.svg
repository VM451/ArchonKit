<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">ArchonKit — modular, local-first AI SDK for Apple platforms</title>
  <desc id="desc">Title block beside an on-device boundary that contains ArchonKit modules and a single gold gate marking host-approved external exits.</desc>

  <rect width="1200" height="400" rx="28" fill="#0C0E12"/>
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="27" fill="none" stroke="#1F232C" stroke-width="1.5"/>

  <!-- Title block -->
  <g id="title-block">
    <text x="64" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" letter-spacing="3" fill="#C9A15A">SWIFT 6.4 · LOCAL-FIRST · SWIFTPM</text>

    <text x="60" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="76" font-weight="700" fill="#F2EFE6">ArchonKit</text>

    <text x="64" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" fill="#C9CCD4">A local-first AI kit for Apple platforms —</text>
    <text x="64" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" fill="#C9CCD4">models, agents, memory, search, tools — on device.</text>

    <!-- Platform chips -->
    <g id="platform-chips" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
      <rect x="64" y="262" width="96" height="34" rx="8" fill="#161A21" stroke="#2C313C"/>
      <text x="112" y="284" text-anchor="middle" fill="#C9CCD4">iOS 27</text>
      <rect x="172" y="262" width="120" height="34" rx="8" fill="#161A21" stroke="#2C313C"/>
      <text x="232" y="284" text-anchor="middle" fill="#C9CCD4">macOS 27</text>
      <rect x="304" y="262" width="148" height="34" rx="8" fill="#161A21" stroke="#2C313C"/>
      <text x="378" y="284" text-anchor="middle" fill="#C9CCD4">visionOS 27</text>
    </g>

    <!-- Gated-boundary caption -->
    <g id="gated-caption">
      <line x1="64" y1="342" x2="292" y2="342" stroke="#3A3F4A" stroke-width="1.5" stroke-dasharray="7 6"/>
      <rect x="304" y="330" width="24" height="24" rx="6" fill="#0C0E12" stroke="#E0A93E" stroke-width="1.5"/>
      <path d="M310 342 l5 5 l9 -10" fill="none" stroke="#E0A93E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="344" y="347" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" fill="#7E8590">EXTERNAL EXITS NEED HOST APPROVAL</text>
    </g>
  </g>

  <!-- On-device module boundary -->
  <g id="device-boundary">
    <rect x="664" y="60" width="288" height="272" rx="16" fill="#0F1219"
          stroke="#3A3F4A" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="684" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="2" fill="#7E8590">ON DEVICE</text>

    <g id="module-chips" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6E2D6">
      <rect x="680" y="108" width="120" height="52" rx="10" fill="#161A21" stroke="#2C313C"/>
      <text x="740" y="140" text-anchor="middle">Agent</text>
      <rect x="816" y="108" width="120" height="52" rx="10" fill="#161A21" stroke="#2C313C"/>
      <text x="876" y="140" text-anchor="middle">Memory</text>

      <rect x="680" y="172" width="120" height="52" rx="10" fill="#161A21" stroke="#2C313C"/>
      <text x="740" y="204" text-anchor="middle">Models</text>
      <rect x="816" y="172" width="120" height="52" rx="10" fill="#161A21" stroke="#2C313C"/>
      <text x="876" y="204" text-anchor="middle">Search</text>

      <rect x="680" y="236" width="120" height="52" rx="10" fill="#161A21" stroke="#2C313C"/>
      <text x="740" y="268" text-anchor="middle">Sandbox</text>
      <rect x="816" y="236" width="120" height="52" rx="10" fill="#161A21" stroke="#2C313C"/>
      <text x="876" y="268" text-anchor="middle">Connect</text>
    </g>

    <text x="808" y="316" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#7E8590">+ 7 more libraries · 2 tools</text>

    <!-- The single symbolic gate -->
    <rect x="940" y="184" width="24" height="24" rx="6" fill="#0C0E12" stroke="#E0A93E" stroke-width="1.5"/>
    <path d="M946 196 l5 5 l9 -10" fill="none" stroke="#E0A93E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="966" y1="196" x2="1008" y2="196" stroke="#3A3F4A" stroke-width="1.5"/>
    <path d="M1008 191 l8 5 l-8 5 z" fill="#3A3F4A"/>
    <text x="1024" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#C9A15A">OPT-IN EXITS</text>
    <text x="1024" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#7E8590">host-approved</text>
  </g>
</svg>
